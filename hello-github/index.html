<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="Minha primeira página Hello World, pronta para publicar no GitHub Pages.">
  <title>Hello, World! | Meu primeiro site</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="hero" aria-labelledby="titulo">
      <div class="status"><span class="status-dot" aria-hidden="true"></span> Meu primeiro projeto</div>
      <div class="illustration" aria-hidden="true">&lt;/&gt;</div>
      <h1 id="titulo">Hello, <span>World!</span></h1>
      <p id="descricao">Uma página simples, bonita e pronta para o GitHub Pages.</p>
      <button id="botao-ola" type="button">Dizer olá <span aria-hidden="true">→</span></button>
      <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>
    <footer>Feito com HTML, CSS e JavaScript ✨</footer>
  </main>
</body>
</html>
