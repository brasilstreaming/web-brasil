name: Android Native V20 Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-native-v20
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          rm -rf android-native-v20/project
          mkdir -p android-native-v20/project
          base64 -d android-native-v20/source.zip.b64 > android-native-v20/source.zip
          unzip -q android-native-v20/source.zip -d android-native-v20/project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build native debug APK
        working-directory: android-native-v20/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK has no WebView assets
        shell: bash
        run: |
          APK="android-native-v20/project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if unzip -l "$APK" | grep -q "assets/index.html"; then
            echo "ERROR: WebView HTML asset found in native APK"
            exit 1
          fi
          echo "Native APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrasilStreamingNative-V20-debug
          path: android-native-v20/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
